<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b5278"/>
      <stop offset="100%" stop-color="#1b4a3a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#e05530"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Antennae -->
  <path d="M38 28 Q30 18 22 14" stroke="#ffab91" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M42 26 Q38 14 34 8" stroke="#ffab91" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="22" cy="13" r="2" fill="#ffcc80"/>
  <circle cx="34" cy="7" r="2" fill="#ffcc80"/>
  <!-- Tail -->
  <ellipse cx="72" cy="72" rx="12" ry="7" fill="#ff7043" transform="rotate(-20 72 72)"/>
  <ellipse cx="80" cy="75" rx="8" ry="5" fill="#ff8a65" transform="rotate(-30 80 75)"/>
  <ellipse cx="86" cy="76" rx="6" ry="4" fill="#ffab91" transform="rotate(-40 86 76)"/>
  <!-- Body segments -->
  <ellipse cx="60" cy="58" rx="14" ry="11" fill="url(#body)" transform="rotate(-15 60 58)"/>
  <ellipse cx="52" cy="50" rx="13" ry="10" fill="url(#body)" transform="rotate(-10 52 50)"/>
  <!-- Body stripe details -->
  <path d="M48 54 Q55 52 62 56" stroke="#e05530" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M52 60 Q58 57 66 60" stroke="#e05530" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="40" cy="40" rx="16" ry="14" fill="#ff8a65"/>
  <!-- Cheek blush -->
  <circle cx="32" cy="44" r="4" fill="#ff6e40" opacity="0.3"/>
  <!-- Eye white -->
  <ellipse cx="36" cy="36" rx="6" ry="6.5" fill="white"/>
  <!-- Pupil -->
  <circle cx="37.5" cy="35.5" r="4" fill="#1a1a2e"/>
  <!-- Eye highlight -->
  <circle cx="39" cy="34" r="1.8" fill="white"/>
  <!-- Smile -->
  <path d="M33 45 Q38 50 44 46" stroke="#c62828" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M44 52 Q48 60 44 65" stroke="#ff7043" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M48 54 Q53 62 50 67" stroke="#ff7043" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M40 50 Q42 58 38 63" stroke="#ff7043" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Claw -->
  <path d="M30 48 Q24 52 20 50 Q22 46 28 44" fill="#ffab91" stroke="#ff7043" stroke-width="1"/>
</svg>
